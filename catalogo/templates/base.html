{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Catálogo de Suplementos{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'catalogo/css/style.css' %}">
</head>
<body>

    <header>
        <h1>Catálogo de Suplementos</h1>
        <p>Qualidade e saúde em cada escolha.</p>
    </header>

    <main>
        {% block content %}

        {% if messages %}
            {% for message in messages %}
                <div class="messagem {{ message.tags }}">
                    {{ message }}
                </div>            
            {% endfor %}        
        {% endif %}
        

        {% endblock %}
    </main>

    <footer>
        <p>Catálogo de Produtos</p>
    </footer>

</body>
</html>
